name: PR preview

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

env:
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

defaults:
  run:
    shell: bash

# Finish any upload before cleanup runs. Unrelated comments get their own group.
concurrency:
  group: >-
    pr-preview-${{
      github.event.pull_request.number ||
      (github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner &&
      contains(fromJSON('["/preview", "/preview delete"]'), github.event.comment.body) &&
      github.event.issue.number) || github.run_id
    }}
  queue: max

jobs:
  build:
    if: >-
      github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Find the PR revision that passed CI
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -r --arg repo "$GITHUB_REPOSITORY" '
            select(.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo) | .head.sha')
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Preview requires an open PR to main from this repository.'
            exit 1
          fi
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$sha" |
            jq -r --argjson pr "$PR_NUMBER" '[.workflow_runs[] | select(any(.pull_requests[]; .number == $pr))][0].conclusion')
          if [[ "$result" != success ]]; then
            echo '::error::Wait for CI to pass on the current commit, then comment /preview again.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run build -w @wornways/web
        env:
          # The checkout is a bare commit; the header shows pr-<number> · commit.
          WORNWAYS_BRANCH: pr-${{ env.PR_NUMBER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-preview-site
          path: |
            apps/web/dist
            !apps/web/dist/_routes.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      # Only the static build crosses into the job that has the Cloudflare token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-preview-site
          path: ${{ runner.temp }}/pr-preview-site
      - name: Check that the PR is still open at the built revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          test -f "$RUNNER_TEMP/pr-preview-site/index.html"
          test ! -e "$RUNNER_TEMP/pr-preview-site/_worker.js"
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')
          if [[ "$current" == "$SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::The PR closed or changed. Use /preview again on the current commit.'
          fi
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: upload
        if: steps.current.outputs.deploy == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          packageManager: npm
          workingDirectory: ${{ runner.temp }}
          command: >-
            pages deploy pr-preview-site --project-name=wornways
            --branch=pr-${{ env.PR_NUMBER }} --commit-hash=${{ needs.build.outputs.sha }}
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.upload.outcome == 'success'
        with:
          number_force: ${{ env.PR_NUMBER }}
          header: wornways-preview
          message: >-
            [Open the Wornways preview](https://pr-${{ env.PR_NUMBER }}.wornways.pages.dev)
            for commit `${{ needs.build.outputs.sha }}`.

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/preview delete')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Remove this PR's Cloudflare Pages deployments
        id: remove
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')
            [[ "$state" == closed ]] || exit 0
          fi

          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/wornways/deployments"
          cf() {
            curl --silent --show-error --fail-with-body --max-time 15 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@" |
              jq -c 'if .success then .result else error(.errors | map(.message) | join(", ")) end'
          }

          # Collect every ID before deleting so the pages don't shift while we read them.
          ids=$(mktemp)
          for ((page = 1; ; page++)); do
            deployments=$(cf "$endpoint?env=preview&per_page=25&page=$page")
            jq -r --arg branch "pr-$PR_NUMBER" '
              .[] | select(.environment == "preview" and .deployment_trigger.metadata.branch == $branch) | .id
            ' <<< "$deployments" >> "$ids"
            [[ "$(jq 'length' <<< "$deployments")" == 25 ]] || break
          done
          while IFS= read -r id; do
            cf -X DELETE "$endpoint/$id?force=true" >/dev/null
          done < "$ids"

          url="https://pr-$PR_NUMBER.wornways.pages.dev"
          for _ in {1..8}; do
            status=$(curl --silent --head --max-time 10 --output /dev/null --write-out '%{http_code}' "$url") || status=000
            if [[ "$status" == 404 || "$status" == 410 ]]; then
              echo 'removed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::The preview URL still returns HTTP $status after cleanup."
          exit 1
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.remove.outputs.removed == 'true'
        with:
          number_force: ${{ env.PR_NUMBER }}
          header: wornways-preview
          only_update: true
          message: The Wornways preview for this PR has been removed.

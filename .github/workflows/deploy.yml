# Publishes the web app on Cloudflare Pages: once CI has passed for a push to main, builds
# that commit and uploads the built app. Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

# One deploy at a time, in order; a running one is never cut off.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wornways.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @wornways/web
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # The Pages project is created on the first deploy; afterwards this reports that it
          # exists already, which is fine (a real problem shows in the deploy below).
          preCommands: npx wrangler pages project create wornways --production-branch=main || true
          command: >-
            pages deploy apps/web/dist --project-name=wornways --branch=main
            --commit-hash=${{ github.event.workflow_run.head_sha }}

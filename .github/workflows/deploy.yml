# Publishes the web app on Cloudflare Pages.
#
# - Production (https://wornways.pages.dev): when a GitHub Release is published, or when the
#   workflow is run by hand ("Run workflow", picking a tag or branch to deploy, e.g. to roll
#   back). The full CI runs on that commit first; the app is deployed only if it passes.
# - Preview (https://preview.wornways.pages.dev): once CI has passed for a push to main.
#
# Cloudflare treats a deploy to the project's production branch, `main`, as production and a
# deploy to any other branch name as a preview at <branch>.wornways.pages.dev.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare
# Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  production:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    # One production deploy at a time, in order; a running one is never cut off.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://wornways.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @wornways/web
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: >-
            pages deploy apps/web/dist --project-name=wornways --branch=main
            --commit-hash=${{ github.sha }}

  preview:
    name: Deploy a preview
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # One preview deploy at a time, in order; a running one is never cut off.
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    environment:
      name: preview
      url: https://preview.wornways.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @wornways/web
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.2'
          command: >-
            pages deploy apps/web/dist --project-name=wornways --branch=preview
            --commit-hash=${{ github.event.workflow_run.head_sha }}

# Dependabot (a GitHub service, not a workflow) opens pull requests that update the npm
# packages and the GitHub Actions above, once a week, minor and patch updates grouped
# into one pull request each. New releases wait a few days first, so a broken release
# can be pulled before it reaches the project.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new TypeScript major waits until typescript-eslint, which the lint relies on,
      # supports it (8.72 accepts TypeScript below 6.1).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    cooldown:
      default-days: 7
